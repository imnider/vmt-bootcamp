@if(loading()){
    <div>Cargando...</div>
}
@if(error()){
    <div>{{error()}}</div>
}
@if(!loading() && !error()){
    <div>
        <div>Estudiantes</div>
        <button matButton (click)="abrirFormulario()"> Agregar </button>
    </div>
    <div class="card-container">
        @for(student of students(); track student.id){
            <mat-card class="example-card" appearance="outlined">
            <mat-card-header>
                <div mat-card-avatar class="example-header-image"></div>
                <mat-card-title>{{student.name}}</mat-card-title>
                <mat-card-subtitle>Id: {{student.id}}</mat-card-subtitle>
            </mat-card-header>
            <img mat-card-image [src]="student.avatar" width="100px">
            <mat-card-content>
                <div>{{student.email}}</div>
                <div>{{student.courseId}}</div>
                <div>{{student.createdAt}}</div>
            </mat-card-content>
            <mat-card-actions>
                <button matButton (click)="verDetalle(student.id)"> Detalle </button>
                <button matButton (click)="abrirFormulario(student)"> Editar </button>
                <button matButton (click)="abrirDialog(student)"> Eliminar </button>
            </mat-card-actions>
            </mat-card>
        }
    </div>
}
