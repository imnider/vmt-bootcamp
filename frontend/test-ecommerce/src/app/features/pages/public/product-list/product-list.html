
<div class="products-grid">
  @for (product of products(); track product.id) {

    <mat-card class="product-card">

      <img
        mat-card-image
        [src]="product.thumbnail"
        [alt]="product.title">

      <mat-card-content>

        <h2 class="product-title">
          {{ product.title }}
        </h2>

        <p class="product-category">
          {{ product.category }}
        </p>

        <p class="product-price">
          ${{ product.price }}
        </p>

      </mat-card-content>

    </mat-card>

  }

</div>
